[config]
schemaVersion = "0.0.1"


[package]
namespace = "SWu"
name = "BoonEdits"
versionNumber = "1.0.3"
description = "Reworks and edits to over 30 Hades II boons, each configurable."
websiteUrl = "https://github.com/vegatarianspam-23/BoonEdit---Hades2Mod"
containsNsfwContent = false

[package.dependencies]
Hell2Modding-Hell2Modding = "1.0.119"
LuaENVY-ENVY = "1.2.1"
SGG_Modding-Chalk = "2.1.2"
SGG_Modding-ReLoad = "1.0.3"
SGG_Modding-SJSON = "1.0.3"
SGG_Modding-ModUtil = "4.0.1"


[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "./CHANGELOG.md"
target = "./CHANGELOG.md"

[[build.copy]]
source = "./LICENSE"
target = "./LICENSE"

[[build.copy]]
source = "./src"
target = "./plugins"


[publish]
repository = "https://thunderstore.io"
communities = [ "hades-ii", ]

[publish.categories]
hades-ii = [ "mods", "gameplay", "ai-generated", ]
